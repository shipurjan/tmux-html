<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>tmux Pane Simulator</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
      font-family: monospace; 
      background: #1e1e1e; 
      color: #fff;
      overflow: hidden;
      height: 100vh;
    }
    
    #root {
      width: 100vw;
      height: 100vh;
      display: flex;
      position: relative;
    }
    
    .pane-container {
      display: flex;
      flex: 1;
      position: relative;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    .pane-container.active {
      border: 1px solid #00ff00;
    }

    .pane-wrapper {
      display: flex;
      min-width: 50px;
      min-height: 50px;
    }
    
    .pane {
      border: 1px solid #3e3e3e;
      display: flex;
      flex-direction: column;
      position: relative;
      flex: 1;
      width: 100%;
      height: 100%;
    }
    
    .pane.active {
      border-color: #00ff00;
    }
    
    .delete-btn {
      position: absolute;
      top: 4px;
      right: 4px;
      z-index: 5;
      background: #4a2020;
      border: 1px solid #5a3030;
    }

    .delete-btn:hover {
      background: #5a2828;
    }

    .delete-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
      background: #3a1818;
    }

    .delete-btn:disabled:hover {
      background: #3a1818;
    }
    
    .pane-content {
      width: 100%;
      height: 100%;
      padding: 8px;
      overflow: auto;
      cursor: normal;
    }
    
    button {
      background: #3e3e3e;
      color: #fff;
      border: none;
      padding: 2px 6px;
      cursor: pointer;
      font-family: monospace;
      font-size: 11px;
    }
    
    button:hover {
      background: #4e4e4e;
    }

    button:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    button:disabled:hover {
      background: #3e3e3e;
    }

    .split-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #3e3e3e;
      color: #fff;
      border: 2px solid #5e5e5e;
      cursor: pointer;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0.6;
      transition: opacity 0.2s, background 0.2s;
    }

    .split-btn:hover {
      background: #4e4e4e;
      opacity: 1;
      border-color: #00ff00;
    }

    .split-btn-pane {
      position: absolute;
      z-index: 5;
    }

    .split-btn-pane-bottom {
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
    }

    .split-btn-pane-right {
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
    }

    .split-btn-container {
      position: absolute;
      z-index: 100;
    }

    .split-btn-container-top {
      top: 8px;
      left: 50%;
      transform: translateX(-50%);
    }

    .split-btn-container-bottom {
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
    }

    .split-btn-container-left {
      left: 8px;
      top: 50%;
      transform: translateY(-50%);
    }

    .split-btn-container-right {
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
    }

    .resizer {
      background: #3e3e3e;
      position: relative;
      z-index: 10;
      flex-shrink: 0;
    }
    
    .resizer:hover {
      background: #00ff00;
    }
    
    .resizer.horizontal {
      cursor: ns-resize;
      height: 4px;
      width: 100%;
    }
    
    .resizer.vertical {
      cursor: ew-resize;
      width: 4px;
      height: 100%;
    }
    
    .h-split { flex-direction: column; }
    .v-split { flex-direction: row; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useRef, useEffect } = React;

    const LOG_LEVELS = {
      debug: 0,
      info: 1,
      warn: 2,
      error: 3
    };

    class Logger {
      constructor(prefix, level = LOG_LEVELS.debug) {
        this.prefix = prefix;
        this.level = level;
      }

      safeStringify(object) {
        if (object === null || object === undefined) return '';

        const cache = new Set();
        return JSON.stringify(
          object,
          (_key, value) => {
            if (typeof value === 'object' && value !== null) {
              if (cache.has(value)) {
                return '[Circular]';
              }
              cache.add(value);
            }
            return value;
          },
          2
        );
      }

      debug(message, data) {
        if (this.level >= LOG_LEVELS.debug) {
          console.debug(`[${this.prefix}] DEBUG: ${message}`, data ? this.safeStringify(data) : '');
        }
      }
    }

    const logger = new Logger('tmux');

    const genId = () => crypto.randomUUID();

    const generateGrayShade = () => {
      const base = 0x2d;
      const variation = Math.floor(Math.random() * 20) - 10;
      const value = Math.max(0x20, Math.min(0x40, base + variation));
      return `#${value.toString(16).padStart(2, '0')}${value.toString(16).padStart(2, '0')}${value.toString(16).padStart(2, '0')}`;
    };

    const createPane = () => ({
      id: genId(),
      color: generateGrayShade()
    });

    function Pane({ id, color, onSplit, isActive, onActivate, onDelete, totalPanes }) {
      return (
        <div
          className={`pane ${isActive ? 'active' : ''}`}
          style={{ background: color }}
          onClick={(e) => {
            e.stopPropagation();
            logger.debug('Pane clicked', { paneId: id });
            onActivate(id);
          }}
        >
          <button
            className="delete-btn"
            onClick={(e) => {
              e.stopPropagation();
              logger.debug('Delete button clicked', { paneId: id });
              onDelete(id);
            }}
            disabled={totalPanes === 1}
            title={totalPanes === 1 ? "Cannot delete last pane" : "Delete pane"}
          >
            ×
          </button>
          <div className="pane-content">
          </div>
          {isActive && (
            <>
              <button
                className="split-btn split-btn-pane split-btn-pane-bottom"
                onClick={(e) => {
                  e.stopPropagation();
                  logger.debug('Split horizontal button clicked', { paneId: id, direction: 'h' });
                  onSplit(id, 'h');
                }}
                title="Split horizontally"
              >
                +
              </button>
              <button
                className="split-btn split-btn-pane split-btn-pane-right"
                onClick={(e) => {
                  e.stopPropagation();
                  logger.debug('Split vertical button clicked', { paneId: id, direction: 'v' });
                  onSplit(id, 'v');
                }}
                title="Split vertically"
              >
                +
              </button>
            </>
          )}
        </div>
      );
    }

    function Resizer({ direction, onResize, containerId, onActivateContainer }) {
      const isDragging = useRef(false);
      const hasDragged = useRef(false);
      const startPos = useRef(0);
      const containerRef = useRef(null);

      useEffect(() => {
        const handleMouseMove = (e) => {
          if (!isDragging.current) return;
          hasDragged.current = true;
          const delta = direction === 'h'
            ? e.clientY - startPos.current
            : e.clientX - startPos.current;
          onResize(delta);
          startPos.current = direction === 'h' ? e.clientY : e.clientX;
        };

        const handleMouseUp = () => {
          isDragging.current = false;
        };

        document.addEventListener('mousemove', handleMouseMove);
        document.addEventListener('mouseup', handleMouseUp);

        return () => {
          document.removeEventListener('mousemove', handleMouseMove);
          document.removeEventListener('mouseup', handleMouseUp);
        };
      }, [direction, onResize]);

      const handleMouseDown = (e) => {
        isDragging.current = true;
        hasDragged.current = false;
        startPos.current = direction === 'h' ? e.clientY : e.clientX;
        e.preventDefault();
      };

      const handleClick = (e) => {
        if (hasDragged.current) {
          logger.debug('Resizer dragged, not activating container');
          return;
        }
        logger.debug('Resizer clicked', { containerId });
        onActivateContainer(containerId);
        e.stopPropagation();
      };

      return (
        <div
          ref={containerRef}
          className={`resizer ${direction === 'h' ? 'horizontal' : 'vertical'}`}
          onMouseDown={handleMouseDown}
          onClick={handleClick}
        />
      );
    }

    function PaneContainer({ node, onSplit, onDelete, totalPanes, activeId, onActivate, activeContainerId, onActivateContainer, onContainerSplit }) {
      if (!node.children) {
        return (
          <Pane
            id={node.id}
            color={node.color}
            onSplit={onSplit}
            onDelete={onDelete}
            totalPanes={totalPanes}
            isActive={activeId === node.id}
            onActivate={onActivate}
          />
        );
      }

      const [sizes, setSizes] = useState(node.children.map(() => 1));
      const containerRef = useRef(null);

      const handleResize = (index, delta) => {
        if (!containerRef.current) return;
        
        setSizes(prev => {
          const newSizes = [...prev];
          const containerSize = node.split === 'h' 
            ? containerRef.current.offsetHeight 
            : containerRef.current.offsetWidth;
          
          const total = newSizes.reduce((a, b) => a + b, 0);
          const deltaRatio = (delta / containerSize) * total;
          
          newSizes[index] = Math.max(0.1, newSizes[index] + deltaRatio);
          newSizes[index + 1] = Math.max(0.1, newSizes[index + 1] - deltaRatio);
          
          return newSizes;
        });
      };

      const isActive = activeContainerId === node.id;

      return (
        <div ref={containerRef} className={`pane-container ${node.split === 'h' ? 'h-split' : 'v-split'} ${isActive ? 'active' : ''}`}>
          {node.children.map((child, i) => (
            <React.Fragment key={child.id}>
              <div className="pane-wrapper" style={{ flex: sizes[i] }}>
                <PaneContainer
                  node={child}
                  onSplit={onSplit}
                  onDelete={onDelete}
                  totalPanes={totalPanes}
                  activeId={activeId}
                  onActivate={onActivate}
                  activeContainerId={activeContainerId}
                  onActivateContainer={onActivateContainer}
                  onContainerSplit={onContainerSplit}
                />
              </div>
              {i < node.children.length - 1 && (
                <Resizer
                  direction={node.split}
                  onResize={(delta) => handleResize(i, delta)}
                  containerId={node.id}
                  onActivateContainer={onActivateContainer}
                />
              )}
            </React.Fragment>
          ))}
          {isActive && (
            <>
              <button
                className="split-btn split-btn-container split-btn-container-top"
                onClick={(e) => { e.stopPropagation(); onContainerSplit(node.id, 'h', 'before'); }}
                title="Add pane above"
              >
                +
              </button>
              <button
                className="split-btn split-btn-container split-btn-container-bottom"
                onClick={(e) => { e.stopPropagation(); onContainerSplit(node.id, 'h', 'after'); }}
                title="Add pane below"
              >
                +
              </button>
              <button
                className="split-btn split-btn-container split-btn-container-left"
                onClick={(e) => { e.stopPropagation(); onContainerSplit(node.id, 'v', 'before'); }}
                title="Add pane to left"
              >
                +
              </button>
              <button
                className="split-btn split-btn-container split-btn-container-right"
                onClick={(e) => { e.stopPropagation(); onContainerSplit(node.id, 'v', 'after'); }}
                title="Add pane to right"
              >
                +
              </button>
            </>
          )}
        </div>
      );
    }

    const countTotalPanes = (node) => {
      if (!node.children) return 1;
      return node.children.reduce((sum, child) => sum + countTotalPanes(child), 0);
    };

    const findFirstPaneId = (node) => {
      if (!node.children) return node.id;
      return findFirstPaneId(node.children[0]);
    };

    const removePaneAndCollapse = (node, paneId) => {
      if (!node) return null;

      if (!node.children) {
        return node.id === paneId ? null : node;
      }

      const newChildren = node.children
        .map(child => removePaneAndCollapse(child, paneId))
        .filter(child => child !== null);

      if (newChildren.length === 0) return null;
      if (newChildren.length === 1) return newChildren[0];

      return { ...node, children: newChildren };
    };

    const insertPaneIntoContainer = (tree, containerId, direction, position) => {
      logger.debug('insertPaneIntoContainer called', { containerId, direction, position });

      const insert = (node) => {
        if (node.id === containerId) {
          const newPane = createPane();
          const wrapper = {
            id: genId(),
            split: direction,
            children: position === 'before' ? [newPane, node] : [node, newPane]
          };
          logger.debug('Wrapped container', { containerId, wrapperId: wrapper.id, newPaneId: newPane.id });
          return { node: wrapper, newPaneId: newPane.id };
        }

        if (node.children) {
          let foundPaneId = null;
          const newChildren = node.children.map(child => {
            const result = insert(child);
            if (result.newPaneId) foundPaneId = result.newPaneId;
            return result.node;
          });
          return { node: { ...node, children: newChildren }, newPaneId: foundPaneId };
        }

        return { node, newPaneId: null };
      };

      return insert(tree);
    };

    function App() {
      const initialPane = createPane();
      const [tree, setTree] = useState(initialPane);
      const [activeId, setActiveId] = useState(initialPane.id);
      const [activeContainerId, setActiveContainerId] = useState(null);

      useEffect(() => {
        logger.debug('Tree structure', tree);
      }, [tree]);

      const splitPane = (targetId, direction) => {
        logger.debug('splitPane called', { targetId, direction, treeBefore: tree });

        const split = (node) => {
          logger.debug('split visiting node', { nodeId: node.id, hasChildren: !!node.children });

          if (node.id === targetId) {
            const pane1 = { id: genId(), color: node.color };
            const pane2 = createPane();
            const containerId = genId();
            logger.debug('splitting target node', {
              targetId,
              direction,
              containerId,
              newId1: pane1.id,
              newId2: pane2.id,
              inheritedColor: node.color
            });
            return {
              id: containerId,
              split: direction,
              children: [pane1, pane2]
            };
          }
          if (node.children) {
            return {
              ...node,
              children: node.children.map(split)
            };
          }
          return node;
        };

        setTree(prev => {
          const newTree = split(prev);
          logger.debug('splitPane complete', { treeAfter: newTree });
          return newTree;
        });
      };

      const deletePane = (paneId) => {
        logger.debug('deletePane called', { paneId, treeBefore: tree });

        if (countTotalPanes(tree) === 1) {
          logger.debug('deletePane blocked - only one pane left');
          return;
        }

        const newTree = removePaneAndCollapse(tree, paneId);
        logger.debug('deletePane complete', { treeAfter: newTree });

        if (newTree) {
          setTree(newTree);
          if (activeId === paneId) {
            setActiveId(findFirstPaneId(newTree));
          }
        }
      };

      const handlePaneActivate = (paneId) => {
        setActiveContainerId(null);
        setActiveId(paneId);
      };

      const handleContainerActivate = (containerId) => {
        logger.debug('Container activated', { containerId });
        setActiveId(null);
        setActiveContainerId(containerId);
      };

      const handleContainerSplit = (containerId, direction, position) => {
        logger.debug('Container split', { containerId, direction, position });
        const result = insertPaneIntoContainer(tree, containerId, direction, position);
        setTree(result.node);
        setActiveId(result.newPaneId);
        setActiveContainerId(null);
      };

      const totalPanes = countTotalPanes(tree);

      return (
        <PaneContainer
          node={tree}
          onSplit={splitPane}
          onDelete={deletePane}
          totalPanes={totalPanes}
          activeId={activeId}
          onActivate={handlePaneActivate}
          activeContainerId={activeContainerId}
          onActivateContainer={handleContainerActivate}
          onContainerSplit={handleContainerSplit}
        />
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
