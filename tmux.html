<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>tmux Pane Simulator</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
      font-family: monospace; 
      background: #1e1e1e; 
      color: #fff;
      overflow: hidden;
      height: 100vh;
    }
    
    #root {
      width: 100vw;
      height: 100vh;
      display: flex;
      position: relative;
    }

    .root-active-indicator {
      position: fixed;
      top: 24px;
      left: 0;
      right: 0;
      bottom: 0;
      border: 1px solid #00ff00;
      border-top: none;
      pointer-events: none;
      z-index: 99;
    }

    .root-handle {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 24px;
      background: #1a1a1a;
      border-bottom: 1px solid #3e3e3e;
      cursor: pointer;
      z-index: 101;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      color: #666;
      transition: background 0.2s, color 0.2s, border 0.2s;
    }

    .root-handle:hover {
      background: #2a2a2a;
      color: #00ff00;
    }

    .root-handle.active {
      background: #2a2a2a;
      color: #00ff00;
      border: 1px solid #00ff00;
      border-bottom: 1px solid #00ff00;
    }

    .pane-container-wrapper {
      margin-top: 24px;
      height: calc(100vh - 24px);
      width: 100%;
      position: relative;
      display: flex;
    }
    
    .pane-container {
      display: flex;
      flex: 1;
      position: relative;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
    
    .pane-wrapper {
      display: flex;
      min-width: 50px;
      min-height: 50px;
    }
    
    .pane {
      border: 1px solid #3e3e3e;
      display: flex;
      flex-direction: column;
      position: relative;
      flex: 1;
      width: 100%;
      height: 100%;
    }
    
    .pane.active {
      border-color: #00ff00;
    }
    
    .delete-btn {
      position: absolute;
      top: 4px;
      right: 4px;
      z-index: 5;
      background: #4a2020;
      border: 1px solid #5a3030;
    }

    .delete-btn:hover {
      background: #5a2828;
    }

    .delete-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
      background: #3a1818;
    }

    .delete-btn:disabled:hover {
      background: #3a1818;
    }
    
    .pane-content {
      width: 100%;
      height: 100%;
      padding: 8px;
      overflow: auto;
      cursor: normal;
    }
    
    button {
      background: #3e3e3e;
      color: #fff;
      border: none;
      padding: 2px 6px;
      cursor: pointer;
      font-family: monospace;
      font-size: 11px;
    }
    
    button:hover {
      background: #4e4e4e;
    }

    button:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    button:disabled:hover {
      background: #3e3e3e;
    }

    .split-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #3e3e3e;
      color: #fff;
      border: 2px solid #5e5e5e;
      cursor: pointer;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0.6;
      transition: opacity 0.2s, background 0.2s;
    }

    .split-btn:hover {
      background: #4e4e4e;
      opacity: 1;
      border-color: #00ff00;
    }

    .split-btn-pane {
      position: absolute;
      z-index: 5;
    }

    .split-btn-pane-bottom {
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
    }

    .split-btn-pane-right {
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
    }

    .split-btn-viewport {
      position: fixed;
      z-index: 100;
    }

    .split-btn-viewport-top {
      top: 32px;
      left: 50%;
      transform: translateX(-50%);
    }

    .split-btn-viewport-bottom {
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
    }

    .split-btn-viewport-left {
      left: 8px;
      top: 50%;
      transform: translateY(-50%);
    }

    .split-btn-viewport-right {
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
    }

    .resizer {
      background: #3e3e3e;
      position: relative;
      z-index: 10;
      flex-shrink: 0;
    }
    
    .resizer:hover {
      background: #00ff00;
    }
    
    .resizer.horizontal {
      cursor: ns-resize;
      height: 4px;
      width: 100%;
    }
    
    .resizer.vertical {
      cursor: ew-resize;
      width: 4px;
      height: 100%;
    }
    
    .h-split { flex-direction: column; }
    .v-split { flex-direction: row; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useRef, useEffect } = React;

    const LOG_LEVELS = {
      debug: 0,
      info: 1,
      warn: 2,
      error: 3
    };

    class Logger {
      constructor(prefix, level = LOG_LEVELS.debug) {
        this.prefix = prefix;
        this.level = level;
      }

      safeStringify(object) {
        if (object === null || object === undefined) return '';

        const cache = new Set();
        return JSON.stringify(
          object,
          (_key, value) => {
            if (typeof value === 'object' && value !== null) {
              if (cache.has(value)) {
                return '[Circular]';
              }
              cache.add(value);
            }
            return value;
          },
          2
        );
      }

      debug(message, data) {
        if (this.level >= LOG_LEVELS.debug) {
          console.debug(`[${this.prefix}] DEBUG: ${message}`, data ? this.safeStringify(data) : '');
        }
      }
    }

    const logger = new Logger('tmux');

    const genId = () => crypto.randomUUID();

    const generateGrayShade = () => {
      const base = 0x2d;
      const variation = Math.floor(Math.random() * 20) - 10;
      const value = Math.max(0x20, Math.min(0x40, base + variation));
      return `#${value.toString(16).padStart(2, '0')}${value.toString(16).padStart(2, '0')}${value.toString(16).padStart(2, '0')}`;
    };

    const createPane = () => ({
      id: genId(),
      color: generateGrayShade()
    });

    function Pane({ id, color, onSplit, isActive, onActivate, onDelete, totalPanes }) {
      return (
        <div
          className={`pane ${isActive ? 'active' : ''}`}
          style={{ background: color }}
          onClick={(e) => {
            e.stopPropagation();
            logger.debug('Pane clicked', { paneId: id });
            onActivate(id);
          }}
        >
          <button
            className="delete-btn"
            onClick={(e) => {
              e.stopPropagation();
              logger.debug('Delete button clicked', { paneId: id });
              onDelete(id);
            }}
            disabled={totalPanes === 1}
            title={totalPanes === 1 ? "Cannot delete last pane" : "Delete pane"}
          >
            ×
          </button>
          <div className="pane-content">
          </div>
          {isActive && (
            <>
              <button
                className="split-btn split-btn-pane split-btn-pane-bottom"
                onClick={(e) => {
                  e.stopPropagation();
                  logger.debug('Split horizontal button clicked', { paneId: id, direction: 'h' });
                  onSplit(id, 'h');
                }}
                title="Split horizontally"
              >
                +
              </button>
              <button
                className="split-btn split-btn-pane split-btn-pane-right"
                onClick={(e) => {
                  e.stopPropagation();
                  logger.debug('Split vertical button clicked', { paneId: id, direction: 'v' });
                  onSplit(id, 'v');
                }}
                title="Split vertically"
              >
                +
              </button>
            </>
          )}
        </div>
      );
    }

    function Resizer({ direction, onResize }) {
      const isDragging = useRef(false);
      const startPos = useRef(0);
      const containerRef = useRef(null);

      useEffect(() => {
        const handleMouseMove = (e) => {
          if (!isDragging.current) return;
          const delta = direction === 'h' 
            ? e.clientY - startPos.current 
            : e.clientX - startPos.current;
          onResize(delta);
          startPos.current = direction === 'h' ? e.clientY : e.clientX;
        };

        const handleMouseUp = () => {
          isDragging.current = false;
        };

        document.addEventListener('mousemove', handleMouseMove);
        document.addEventListener('mouseup', handleMouseUp);

        return () => {
          document.removeEventListener('mousemove', handleMouseMove);
          document.removeEventListener('mouseup', handleMouseUp);
        };
      }, [direction, onResize]);

      const handleMouseDown = (e) => {
        isDragging.current = true;
        startPos.current = direction === 'h' ? e.clientY : e.clientX;
        e.preventDefault();
      };

      return (
        <div 
          ref={containerRef}
          className={`resizer ${direction === 'h' ? 'horizontal' : 'vertical'}`}
          onMouseDown={handleMouseDown}
        />
      );
    }

    function PaneContainer({ node, onSplit, onDelete, totalPanes, activeId, onActivate }) {
      if (!node.children) {
        return (
          <Pane
            id={node.id}
            color={node.color}
            onSplit={onSplit}
            onDelete={onDelete}
            totalPanes={totalPanes}
            isActive={activeId === node.id}
            onActivate={onActivate}
          />
        );
      }

      const [sizes, setSizes] = useState(node.children.map(() => 1));
      const containerRef = useRef(null);

      const handleResize = (index, delta) => {
        if (!containerRef.current) return;
        
        setSizes(prev => {
          const newSizes = [...prev];
          const containerSize = node.split === 'h' 
            ? containerRef.current.offsetHeight 
            : containerRef.current.offsetWidth;
          
          const total = newSizes.reduce((a, b) => a + b, 0);
          const deltaRatio = (delta / containerSize) * total;
          
          newSizes[index] = Math.max(0.1, newSizes[index] + deltaRatio);
          newSizes[index + 1] = Math.max(0.1, newSizes[index + 1] - deltaRatio);
          
          return newSizes;
        });
      };

      return (
        <div ref={containerRef} className={`pane-container ${node.split === 'h' ? 'h-split' : 'v-split'}`}>
          {node.children.map((child, i) => (
            <React.Fragment key={child.id}>
              <div className="pane-wrapper" style={{ flex: sizes[i] }}>
                <PaneContainer
                  node={child}
                  onSplit={onSplit}
                  onDelete={onDelete}
                  totalPanes={totalPanes}
                  activeId={activeId}
                  onActivate={onActivate}
                />
              </div>
              {i < node.children.length - 1 && (
                <Resizer
                  direction={node.split}
                  onResize={(delta) => handleResize(i, delta)}
                />
              )}
            </React.Fragment>
          ))}
        </div>
      );
    }

    const countTotalPanes = (node) => {
      if (!node.children) return 1;
      return node.children.reduce((sum, child) => sum + countTotalPanes(child), 0);
    };

    const findFirstPaneId = (node) => {
      if (!node.children) return node.id;
      return findFirstPaneId(node.children[0]);
    };

    const removePaneAndCollapse = (node, paneId) => {
      if (!node) return null;

      if (!node.children) {
        return node.id === paneId ? null : node;
      }

      const newChildren = node.children
        .map(child => removePaneAndCollapse(child, paneId))
        .filter(child => child !== null);

      if (newChildren.length === 0) return null;
      if (newChildren.length === 1) return newChildren[0];

      return { ...node, children: newChildren };
    };

    function App() {
      const initialPane = createPane();
      const [tree, setTree] = useState(initialPane);
      const [activeId, setActiveId] = useState(initialPane.id);
      const [isRootActive, setIsRootActive] = useState(false);

      useEffect(() => {
        logger.debug('Tree structure', tree);
      }, [tree]);

      const splitPane = (targetId, direction) => {
        logger.debug('splitPane called', { targetId, direction, treeBefore: tree });

        const split = (node) => {
          logger.debug('split visiting node', { nodeId: node.id, hasChildren: !!node.children });

          if (node.id === targetId) {
            const pane1 = { id: genId(), color: node.color };
            const pane2 = createPane();
            logger.debug('splitting target node', {
              targetId,
              direction,
              newId1: pane1.id,
              newId2: pane2.id,
              inheritedColor: node.color
            });
            return {
              id: node.id,
              split: direction,
              children: [pane1, pane2]
            };
          }
          if (node.children) {
            return {
              ...node,
              children: node.children.map(split)
            };
          }
          return node;
        };

        setTree(prev => {
          const newTree = split(prev);
          logger.debug('splitPane complete', { treeAfter: newTree });
          return newTree;
        });
      };

      const deletePane = (paneId) => {
        logger.debug('deletePane called', { paneId, treeBefore: tree });

        if (countTotalPanes(tree) === 1) {
          logger.debug('deletePane blocked - only one pane left');
          return;
        }

        const newTree = removePaneAndCollapse(tree, paneId);
        logger.debug('deletePane complete', { treeAfter: newTree });

        if (newTree) {
          setTree(newTree);
          if (activeId === paneId) {
            setActiveId(findFirstPaneId(newTree));
          }
        }
      };

      const wrapRootWithSplit = (direction, position) => {
        logger.debug('wrapRootWithSplit called', { direction, position, treeBefore: tree });

        const newPane = createPane();
        const newRoot = {
          id: genId(),
          split: direction,
          children: position === 'before' ? [newPane, tree] : [tree, newPane]
        };

        logger.debug('wrapRootWithSplit complete', { treeAfter: newRoot, newPaneId: newPane.id });

        setTree(newRoot);
        setActiveId(newPane.id);
      };

      const handlePaneActivate = (paneId) => {
        setIsRootActive(false);
        setActiveId(paneId);
      };

      const handleRootActivate = () => {
        setIsRootActive(true);
      };

      const totalPanes = countTotalPanes(tree);

      return (
        <>
          <div
            className={`root-handle ${isRootActive ? 'active' : ''}`}
            onClick={handleRootActivate}
          >
            ~ tmux
          </div>
          <div className="pane-container-wrapper">
            <PaneContainer
              node={tree}
              onSplit={splitPane}
              onDelete={deletePane}
              totalPanes={totalPanes}
              activeId={isRootActive ? null : activeId}
              onActivate={handlePaneActivate}
            />
          </div>
          {isRootActive && (
            <>
              <div className="root-active-indicator" />
              <button
                className="split-btn split-btn-viewport split-btn-viewport-top"
                onClick={() => wrapRootWithSplit('h', 'before')}
                title="Add pane above"
              >
                +
              </button>
              <button
                className="split-btn split-btn-viewport split-btn-viewport-bottom"
                onClick={() => wrapRootWithSplit('h', 'after')}
                title="Add pane below"
              >
                +
              </button>
              <button
                className="split-btn split-btn-viewport split-btn-viewport-left"
                onClick={() => wrapRootWithSplit('v', 'before')}
                title="Add pane to left"
              >
                +
              </button>
              <button
                className="split-btn split-btn-viewport split-btn-viewport-right"
                onClick={() => wrapRootWithSplit('v', 'after')}
                title="Add pane to right"
              >
                +
              </button>
            </>
          )}
        </>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
